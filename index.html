<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101613" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef1ea" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Sum is a local-first monthly ledger: set a limit for each category and see where the month is going."
    />
    <title>Sum · Budget Tracker</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes.
      try {
        var saved = localStorage.getItem('budget-tracker:v1')
        var theme = saved ? JSON.parse(saved).theme : 'system'
        var dark =
          theme === 'dark' ||
          (theme !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (error) {
        // A damaged saved state is handled by the app itself.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
